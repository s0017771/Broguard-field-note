<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRG 엔지니어링</title>
<meta name="theme-color" content="#1f3a5f">
<style>
  :root{
    --navy:#1f3a5f; --steel:#2b6cb0; --steel-soft:#e8f0f9; --amber:#c98a12;
    --ink:#243244; --muted:#6b7a8d; --line:#dde3ea; --paper:#fff; --bg:#f4f6f9;
    --sans:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;
    display:flex;flex-direction:column}
  .topbar{background:var(--navy);color:#eaf1f8;padding:14px 16px;font-weight:800;letter-spacing:.02em;font-size:1.05rem}
  .topbar small{font-weight:600;opacity:.7;font-size:.72rem;margin-left:6px}
  .wrap{flex:1;max-width:760px;width:100%;margin:0 auto;padding:20px 16px 50px}
  .hub-hd{text-align:center;padding:30px 16px 18px}
  .hub-hd h1{font-size:1.8rem;font-weight:800;color:var(--navy);letter-spacing:.02em}
  .hub-hd p{color:var(--muted);font-size:.92rem;margin-top:8px}
  .card{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:22px 18px;margin-bottom:14px;text-decoration:none;color:inherit;
    transition:border-color .15s,box-shadow .15s,transform .07s}
  .card:hover{border-color:var(--steel);box-shadow:0 6px 20px rgba(43,108,176,.10)}
  .card:active{transform:scale(.99)}
  .card .ic{flex:0 0 58px;height:58px;border-radius:14px;background:var(--steel-soft);color:var(--steel);
    display:flex;align-items:center;justify-content:center;font-size:1.8rem}
  .card h2{font-size:1.15rem;font-weight:800}
  .card h2 .tag{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:2px;
    background:var(--steel-soft);color:var(--steel)}
  .card p{font-size:.83rem;color:var(--muted);margin-top:5px;line-height:1.5}
  .card .chev{margin-left:auto;color:var(--muted);font-size:1.4rem}
  footer{text-align:center;color:#a4afbd;font-size:.72rem;padding:16px 0 26px}
</style>
</head>
<body>
  <div class="topbar">BRG 엔지니어링<small>ENGINEERING</small></div>
  <div class="wrap">
    <div class="hub-hd">
      <h1>BRG 엔지니어링</h1>
      <p>구조물 조사·계측 통합 허브</p>
    </div>

    <a class="card" href="monitoring.html">
      <div class="ic">📈</div>
      <div>
        <h2>BRG 계측 <span class="tag">MONITORING</span></h2>
        <p>구조물 손상 진행성 계측·기록·시각화 (이격·단차)</p>
      </div>
      <span class="chev">›</span>
    </a>

    <a class="card" href="field-note.html">
      <div class="ic">📝</div>
      <div>
        <h2>BRG 현장조사노트 <span class="tag">FIELD NOTE</span></h2>
        <p>구조물 안전점검 현장조사 도면 마킹 도구</p>
      </div>
      <span class="chev">›</span>
    </a>

    <a class="card" href="bridge-survey.html">
      <div class="ic">🌉</div>
      <div>
        <h2>교량 제원 조사 <span class="tag">BRIDGE</span></h2>
        <p>형식·경간·사각 입력 → 횡·종단면·평면 자동 작도, 치수 검증 (위성·로드뷰 배경)</p>
      </div>
      <span class="chev">›</span>
    </a>
  </div>
  <footer>BRG Engineering · 통합 허브</footer>
</body>
</html>
