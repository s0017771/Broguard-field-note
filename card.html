<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>명함 → 연락처</title>
  <style>
    :root {
      --bg: #f4f4f7;
      --card: #ffffff;
      --text: #1a1a2e;
      --sub: #6b6b80;
      --line: #e2e2ea;
      --accent: #2f6df0;
      --accent-press: #2456c6;
      --danger: #d33;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14141c;
        --card: #1f1f2b;
        --text: #f0f0f5;
        --sub: #9a9ab0;
        --line: #33334a;
        --accent: #4d84ff;
        --accent-press: #3a6fe0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    header {
      padding: 18px 16px calc(12px + env(safe-area-inset-top));
      padding-top: calc(18px + env(safe-area-inset-top));
      text-align: center;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
    main { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }

    .capture-btn {
      display: block; width: 100%;
      background: var(--accent); color: #fff;
      border: none; border-radius: 16px;
      padding: 22px; font-size: 18px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .capture-btn:active { background: var(--accent-press); }
    .capture-btn.small { padding: 14px; font-size: 15px; border-radius: 12px; }
    input[type=file] { display: none; }

    .preview { margin-top: 16px; text-align: center; }
    .preview img { max-width: 100%; border-radius: 12px; border: 1px solid var(--line); }

    .status {
      margin-top: 16px; text-align: center; font-size: 15px; color: var(--sub);
      min-height: 22px;
    }
    .status.err { color: var(--danger); }
    .spinner {
      display: inline-block; width: 16px; height: 16px; vertical-align: -3px;
      border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .form { margin-top: 12px; display: none; }
    .form.show { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 12px; font-size: 16px;
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
    }
    .row2 { display: flex; gap: 10px; }
    .row2 .field { flex: 1; }

    .save-btn {
      display: block; width: 100%;
      background: #1aa869; color: #fff;
      border: none; border-radius: 16px;
      padding: 20px; font-size: 18px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .save-btn:active { background: #158a56; }
    .hint { font-size: 12px; color: var(--sub); text-align: center; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>📇 명함 → 연락처</h1>
    <p>브로가드 명함 자동화</p>
  </header>

  <main>
    <button class="capture-btn" id="pickBtn">📷 명함 촬영 / 선택</button>
    <input type="file" id="file" accept="image/*" capture="environment" />

    <div class="preview" id="preview"></div>
    <div class="status" id="status"></div>

    <div class="form" id="form">
      <div class="row2">
        <div class="field"><label>성</label><input id="lastName" /></div>
        <div class="field"><label>이름</label><input id="firstName" /></div>
      </div>
      <div class="field"><label>회사</label><input id="org" /></div>
      <div class="row2">
        <div class="field"><label>부서</label><input id="department" /></div>
        <div class="field"><label>직책</label><input id="title" /></div>
      </div>
      <div class="field"><label>휴대폰</label><input id="mobile" inputmode="tel" /></div>
      <div class="field"><label>회사 전화</label><input id="workPhone" inputmode="tel" /></div>
      <div class="field"><label>팩스</label><input id="fax" inputmode="tel" /></div>
      <div class="field"><label>이메일</label><input id="email" inputmode="email" /></div>
      <div class="field"><label>홈페이지</label><input id="url" /></div>
      <div class="field"><label>주소</label><input id="address" /></div>
      <div class="field"><label>우편번호</label><input id="zipcode" inputmode="numeric" /></div>
      <div class="field"><label>메모</label><input id="note" /></div>

      <button class="save-btn" id="saveBtn">💾 연락처로 저장 (.vcf)</button>
      <p class="hint">저장 버튼을 누르면 vCard 파일이 다운로드됩니다.<br>파일을 열면 폰 연락처 앱으로 바로 추가돼요.</p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const FIELDS = ["lastName","firstName","org","department","title","mobile","workPhone","fax","email","url","address","zipcode","note"];

    $("pickBtn").addEventListener("click", () => $("file").click());
    $("file").addEventListener("change", onFile);
    $("saveBtn").addEventListener("click", saveVcf);

    async function onFile(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      setStatus("이미지 준비 중…", false, true);
      $("form").classList.remove("show");

      try {
        const { dataUrl, base64 } = await resizeToJpeg(f, 1400, 0.8);
        $("preview").innerHTML = '<img src="' + dataUrl + '" alt="명함" />';
        setStatus("명함 분석 중… (몇 초 걸려요)", false, true);

        const resp = await fetch("/api/ocr", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ imageBase64: base64, mediaType: "image/jpeg" }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "분석 실패");

        fill(data.fields || {});
        $("form").classList.add("show");
        setStatus("✅ 추출 완료 — 확인 후 저장하세요");
      } catch (err) {
        setStatus("❌ " + (err.message || err), true);
      } finally {
        e.target.value = "";
      }
    }

    // 브라우저에서 리사이즈 → Vercel 4.5MB 본문 제한 회피 + 속도 향상
    function resizeToJpeg(file, maxEdge, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          const scale = Math.min(1, maxEdge / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({ dataUrl, base64: dataUrl.split(",")[1] });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
        img.src = url;
      });
    }

    function fill(fields) {
      FIELDS.forEach((k) => { $(k).value = fields[k] || ""; });
    }

    function setStatus(msg, isErr, loading) {
      const el = $("status");
      el.className = "status" + (isErr ? " err" : "");
      el.innerHTML = (loading ? '<span class="spinner"></span>' : "") + msg;
    }

    function esc(v) {
      // vCard 3.0 이스케이프
      return String(v || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
    }

    function buildVcard() {
      const g = (id) => $(id).value.trim();
      const last = g("lastName"), first = g("firstName");
      const fn = (last + first) || first || last || "연락처";
      const lines = ["BEGIN:VCARD", "VERSION:3.0"];
      lines.push("FN:" + esc(fn));
      lines.push("N:" + esc(last) + ";" + esc(first) + ";;;");
      const org = g("org"), dept = g("department");
      if (org || dept) lines.push("ORG:" + esc(org) + (dept ? ";" + esc(dept) : ""));
      if (g("title")) lines.push("TITLE:" + esc(g("title")));
      if (g("mobile")) lines.push("TEL;TYPE=CELL:" + esc(g("mobile")));
      if (g("workPhone")) lines.push("TEL;TYPE=WORK:" + esc(g("workPhone")));
      if (g("fax")) lines.push("TEL;TYPE=FAX,WORK:" + esc(g("fax")));
      if (g("email")) lines.push("EMAIL:" + esc(g("email")));
      if (g("address") || g("zipcode")) {
        lines.push("ADR;TYPE=WORK:;;" + esc(g("address")) + ";;;" + esc(g("zipcode")) + ";");
      }
      if (g("url")) lines.push("URL:" + esc(g("url")));
      if (g("note")) lines.push("NOTE:" + esc(g("note")));
      lines.push("END:VCARD");
      return { vcf: lines.join("\r\n"), fn };
    }

    function saveVcf() {
      const { vcf, fn } = buildVcard();
      const d = new Date();
      const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "명함_" + fn + "_" + ymd + ".vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
  </script>
</body>
</html>
